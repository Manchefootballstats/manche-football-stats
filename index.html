<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manche Football Stats</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    font-size: 15px;
}

nav {
    background: white;
    padding: 12px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

nav button {
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    background: #e5e7eb;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

nav button.active {
    background: #111827;
    color: white;
}

main {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

h2 {
    margin-top: 0;
}

select {
    width: 100%;
    max-width: 350px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 20px;
    font-size: 16px;
    background: white;
}

.table-container {
    width: 100%;
    overflow-x: auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #111827;
    color: white;
    padding: 12px 8px;
    text-align: center;
}

td {
    padding: 11px 8px;
    border-bottom: 1px solid #eee;
    text-align: center;
}

tr:last-child td {
    border-bottom: none;
}

.match-day {
    margin-bottom: 25px;
}

.match-day-title {
    background: #111827;
    color: white;
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 18px;
    font-weight: bold;
}

.match-card {
    background: white;
    border-radius: 12px;
    margin-bottom: 15px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.match-date {
    font-weight: bold;
    margin-bottom: 5px;
}

.match-competition {
    font-size: 14px;
    color: #666;
}

.match-poule {
    display: inline-block;
    background: #e5e7eb;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}

.match-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 15px;
}

.team {
    font-weight: bold;
}

.team.home {
    text-align: right;
}

.team.away {
    text-align: left;
}

.score {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

.match-status {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: #666;
}

.loading {
    text-align: center;
    padding: 25px;
}

.message {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

footer {
    margin-top: 40px;
    background: #111827;
    color: white;
    text-align: center;
    padding: 20px;
}

footer p {
    margin: 5px;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 24px;
    }

    main {
        margin-top: 15px;
    }

    .match-teams {
        grid-template-columns: 1fr;
        gap: 8px;
        text-align: center;
    }

    .team.home,
    .team.away {
        text-align: center;
    }

    .score {
        font-size: 24px;
    }

}

</style>

</head>

<body>

<header>

    <h1>Manche Football Stats</h1>

    <p>⚽ Le football manchois en chiffres 📊</p>

</header>

<nav>

    <button
        id="btnClassement"
        class="active"
        onclick="afficherSection('classement')">

        Classements

    </button>

    <button
        id="btnButeurs"

        Buteurs

    </button>

    <button
        id="btnCartons"

        🟨 Cartons

    </button>

    <button
        id="btnResultats"
        onclick="afficherSection('resultats')">

        Résultats

    </button>

</nav>

<main>

<section id="classement" class="section active">

    <h2>🏆 Classement</h2>

    <select
        id="pouleClassement"
        onchange="afficherClassement()">

        <option value="D1 A">D1 A</option>

        <option value="D3 B">D3 B</option>
        <option value="D3 C">D3 C</option>

        <option value="D4 F">D4 F</option>

        <div class="loading">

</section>

    <h2>⚽ Classement des buteurs</h2>

    <select
        id="pouleButeurs"

        <option value="D3 A">D3 A</option>
        <option value="D3 B">D3 B</option>
        <option value="D3 C">D3 C</option>
        <option value="D3 D">D3 D</option>
        <option value="D3 E">D3 E</option>

        <option value="D4 A">D4 A</option>
        <option value="D4 B">D4 B</option>
        <option value="D4 C">D4 C</option>
        <option value="D4 D">D4 D</option>
        <option value="D4 E">D4 E</option>
        <option value="D4 F">D4 F</option>

    </select>

    <div id="buteursResult">

        <div class="loading">
            Chargement des buteurs...
        </div>

    </div>

</section>


<section id="cartons" class="section">

    <h2>🟨 Cartons</h2>

    <select
        id="pouleCartons"
        onchange="afficherCartons()">

        <option value="D1 A">D1 A</option>
        <option value="D1 B">D1 B</option>

        <option value="D2 A">D2 A</option>
        <option value="D2 B">D2 B</option>
        <option value="D2 C">D2 C</option>

        <option value="D3 A">D3 A</option>
        <option value="D3 B">D3 B</option>
        <option value="D3 C">D3 C</option>
        <option value="D3 D">D3 D</option>
        <option value="D3 E">D3 E</option>

        <option value="D4 A">D4 A</option>
        <option value="D4 B">D4 B</option>
        <option value="D4 C">D4 C</option>
        <option value="D4 D">D4 D</option>
        <option value="D4 E">D4 E</option>
        <option value="D4 F">D4 F</option>

    </select>

    <div id="cartonsResult">

        <div class="loading">
            Chargement des cartons...
        </div>

    </div>

</section>


<section id="resultats" class="section">

    <h2>📅 Résultats</h2>

    <select
        id="pouleResultats"
        onchange="afficherResultats()">

        <option value="Toutes">Toutes les poules</option>

        <option value="D1 A">D1 A</option>
        <option value="D1 B">D1 B</option>

        <option value="D2 A">D2 A</option>
        <option value="D2 B">D2 B</option>
        <option value="D2 C">D2 C</option>

        <option value="D3 A">D3 A</option>
        <option value="D3 B">D3 B</option>
        <option value="D3 C">D3 C</option>
        <option value="D3 D">D3 D</option>
        <option value="D3 E">D3 E</option>

        <option value="D4 A">D4 A</option>
        <option value="D4 B">D4 B</option>
        <option value="D4 C">D4 C</option>
        <option value="D4 D">D4 D</option>
        <option value="D4 E">D4 E</option>
        <option value="D4 F">D4 F</option>

    </select>

    <div id="resultatsResult">

        <div class="loading">
            Chargement des résultats...
        </div>

    </div>

</section>

</main>

<footer>

    <p>📲 Manche Football Stats</p>

    <p>⚽ Le football manchois en chiffres 📊</p>

</footer>

<script>

// =====================================================
// CONFIGURATION
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxBUI2bCPUZT_p-0JasgBvFD-tcsvU1wj2VDiIKFFhBhFTc25ferP-gvJBW0qd7VHefrQ/exec";

let classementData = [];

let buteursData = [];

let cartonsData = [];

let matchsData = [];


// =====================================================
// NORMALISER UNE POULE
// =====================================================

function normaliserPoule(valeur) {

    return String(valeur || "")
        .replace(/\s+/g, "")
        .toUpperCase();

}


// =====================================================
// CHANGER DE RUBRIQUE
// =====================================================

function afficherSection(section) {

    document.querySelectorAll(".section").forEach(function(el) {

        el.classList.remove("active");

    });

    document.querySelectorAll("nav button").forEach(function(el) {

        el.classList.remove("active");

    });

    document.getElementById(section).classList.add("active");

    if (section === "classement") {

        document
            .getElementById("btnClassement")
            .classList.add("active");

    }

    if (section === "buteurs") {

        document
            .getElementById("btnButeurs")
            .classList.add("active");

    }

    if (section === "cartons") {

        document
            .getElementById("btnCartons")
            .classList.add("active");

        afficherCartons();

    }

    if (section === "resultats") {

        document
            .getElementById("btnResultats")
            .classList.add("active");

        afficherResultats();

    }

}


// =====================================================
// CHARGER CLASSEMENTS
// =====================================================

async function chargerClassements() {

    try {

        const response = await fetch(
            API_URL + "?sheet=Classement"
        );

        classementData = await response.json();

        afficherClassement();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "classementResult"
        ).innerHTML = `

            <div class="message">

                ❌ Impossible de charger le classement.

            </div>

        `;

    }

}


// =====================================================
// AFFICHER CLASSEMENT
// =====================================================

function afficherClassement() {

    const poule =
        document.getElementById(
            "pouleClassement"
        ).value;

    let data = classementData.filter(function(row) {

        return normaliserPoule(row.Poule) ===
               normaliserPoule(poule);

    });

    data.sort(function(a, b) {

        const ptsA = Number(a.Pts) || 0;

        const ptsB = Number(b.Pts) || 0;

        if (ptsB !== ptsA) {

            return ptsB - ptsA;

        }

        const diffA = Number(a.Diff) || 0;

        const diffB = Number(b.Diff) || 0;

        if (diffB !== diffA) {

            return diffB - diffA;

        }

        const bpA = Number(a.BP) || 0;

        const bpB = Number(b.BP) || 0;

        return bpB - bpA;

    });

    let html = `

        <div class="table-container">

        <table>

        <thead>

            <tr>

                <th>Pos</th>

                <th>Club</th>

                <th>MJ</th>

                <th>V</th>

                <th>N</th>

                <th>D</th>

                <th>BP</th>

                <th>BC</th>

                <th>Diff</th>

                <th>Pts</th>

            </tr>

        </thead>

        <tbody>

    `;

    data.forEach(function(row, index) {

        html += `

            <tr>

                <td><strong>${index + 1}</strong></td>

                <td>${row.Club || ""}</td>

                <td>${row.MJ || 0}</td>

                <td>${row.V || 0}</td>

                <td>${row.N || 0}</td>

                <td>${row.D || 0}</td>

                <td>${row.BP || 0}</td>

                <td>${row.BC || 0}</td>

                <td>${row.Diff || 0}</td>

                <td><strong>${row.Pts || 0}</strong></td>

            </tr>

        `;

    });

    if (data.length === 0) {

        html += `

            <tr>

                <td colspan="10">

                    Aucun classement enregistré
                    pour cette poule.

                </td>

            </tr>

        `;

    }

    html += `

        </tbody>

        </table>

        </div>

    `;

    document.getElementById(
        "classementResult"
    ).innerHTML = html;

}


// =====================================================
// CHARGER BUTEURS
// =====================================================

async function chargerButeurs() {

    try {

        const response = await fetch(
            API_URL + "?sheet=Buteurs"
        );

        buteursData = await response.json();

        afficherButeurs();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "buteursResult"
        ).innerHTML = `

            <div class="message">

                ❌ Impossible de charger les buteurs.

            </div>

        `;

    }

}


// =====================================================
// AFFICHER BUTEURS
// =====================================================

function afficherButeurs() {

    const poule =
        document.getElementById(
            "pouleButeurs"
        ).value;

    let data = buteursData.filter(function(row) {

        return normaliserPoule(row.Poule) ===
               normaliserPoule(poule);

    });

    data.sort(function(a, b) {

        const butsA = Number(a.Buts) || 0;

        const butsB = Number(b.Buts) || 0;

        return butsB - butsA;

    });

    let html = `

        <div class="table-container">

        <table>

        <thead>

            <tr>

                <th>Pos</th>

                <th>Joueur</th>

                <th>Club</th>

                <th>Buts</th>

            </tr>

        </thead>

        <tbody>

    `;

    data.forEach(function(row, index) {

        html += `

            <tr>

                <td><strong>${index + 1}</strong></td>

                <td>${row.Joueur || ""}</td>

                <td>${row.Club || ""}</td>

                <td><strong>${row.Buts || 0}</strong></td>

            </tr>

        `;

    });

    if (data.length === 0) {

        html += `

            <tr>

                <td colspan="4">

                    Aucun buteur enregistré
                    pour cette poule.

                </td>

            </tr>

        `;

    }

    html += `

        </tbody>

        </table>

        </div>

    `;

    document.getElementById(
        "buteursResult"
    ).innerHTML = html;

}


// =====================================================
// CHARGER CARTONS
// =====================================================

async function chargerCartons() {

    try {

        const response = await fetch(
            API_URL + "?sheet=Cartons"
        );

        if (!response.ok) {

            throw new Error(
                "Erreur lors du chargement des cartons"
            );

        }

        cartonsData = await response.json();

        afficherCartons();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "cartonsResult"
        ).innerHTML = `

            <div class="message">

                ❌ Impossible de charger les cartons.

            </div>

        `;

    }

}


// =====================================================
// AFFICHER CARTONS
// =====================================================

function afficherCartons() {

    const select =
        document.getElementById(
            "pouleCartons"
        );

    if (!select) {

        return;

    }

    const poule = select.value;

    let data = cartonsData.filter(function(row) {

        return normaliserPoule(row.Poule) ===
               normaliserPoule(poule);

    });

    data.sort(function(a, b) {

        const jaunesA = Number(a.Jaunes) || 0;

        const jaunesB = Number(b.Jaunes) || 0;

        if (jaunesB !== jaunesA) {

            return jaunesB - jaunesA;

        }

        const rougesA = Number(a.Rouges) || 0;

        const rougesB = Number(b.Rouges) || 0;

        return rougesB - rougesA;

    });

    let html = `

        <div class="table-container">

        <table>

        <thead>

            <tr>

                <th>Pos</th>

                <th>Joueur</th>

                <th>Club</th>

                <th>🟨 Jaunes</th>

                <th>🟥 Rouges</th>

            </tr>

        </thead>

        <tbody>

    `;

    data.forEach(function(row, index) {

        html += `

            <tr>

                <td><strong>${index + 1}</strong></td>

                <td>${row.Joueur || ""}</td>

                <td>${row.Club || ""}</td>

                <td><strong>${row.Jaunes || 0}</strong></td>

                <td><strong>${row.Rouges || 0}</strong></td>

            </tr>

        `;

    });

    if (data.length === 0) {

        html += `

            <tr>

                <td colspan="5">

                    Aucun carton enregistré
                    pour cette poule.

                </td>

            </tr>

        `;

    }

    html += `

        </tbody>

        </table>

        </div>

    `;

    document.getElementById(
        "cartonsResult"
    ).innerHTML = html;

}


// =====================================================
// CHARGER LES MATCHS
// =====================================================

async function chargerMatchs() {

    try {

        const response = await fetch(
            API_URL + "?sheet=Matchs"
        );

        if (!response.ok) {

            throw new Error(
                "Erreur lors du chargement des matchs"
            );

        }

        matchsData = await response.json();

        console.log(
            "Matchs récupérés :",
            matchsData
        );

        afficherResultats();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "resultatsResult"
        ).innerHTML = `

            <div class="message">

                ❌ Impossible de charger les résultats.

            </div>

        `;

    }

}


// =====================================================
// AFFICHER LES RESULTATS PAR JOURNEE
// =====================================================

function afficherResultats() {

    const select =
        document.getElementById(
            "pouleResultats"
        );

    if (!select) {

        return;

    }

    const poule = select.value;

    let data = matchsData.filter(function(row) {

        if (
            !row.Domicile &&
            !row.Exterieur
        ) {

            return false;

        }

        if (poule === "Toutes") {

            return true;

        }

        return normaliserPoule(row.Poule) ===
               normaliserPoule(poule);

    });

    data.sort(function(a, b) {

        const journeeA = Number(a.Journee) || 0;

        const journeeB = Number(b.Journee) || 0;

        if (journeeA !== journeeB) {

            return journeeB - journeeA;

        }

        return convertirDate(b.Date) -
               convertirDate(a.Date);

    });

    const journees = {};

    data.forEach(function(row) {

        const journee =
            row.Journee !== undefined &&
            row.Journee !== ""
                ? row.Journee
                : "Autres";

        if (!journees[journee]) {

            journees[journee] = [];

        }

        journees[journee].push(row);

    });

    let html = "";

    const listeJournees =
        Object.keys(journees).sort(function(a, b) {

            const numA = Number(a);

            const numB = Number(b);

            if (
                !isNaN(numA) &&
                !isNaN(numB)
            ) {

                return numB - numA;

            }

            return String(b).localeCompare(
                String(a),
                "fr"
            );

        });

    listeJournees.forEach(function(journee) {

        html += `

            <div class="match-day">

                <div class="match-day-title">

                    📅 Journée ${journee}

                </div>

        `;

        journees[journee].forEach(function(row) {

            const domicile =
                row.Domicile || "";

            const exterieur =
                row.Exterieur || "";

            const scoreDom =
                row["Score Dom."] || "";

            const scoreExt =
                row["Score Ext."] || "";

            let score = "À venir";

            if (
                scoreDom !== "" ||
                scoreExt !== ""
            ) {

                score =
                    scoreDom +
                    " - " +
                    scoreExt;

            }

            html += `

                <div class="match-card">

                    <div class="match-header">

                        <div>

                            <div class="match-date">

                                📅 ${row.Date || ""}

                            </div>

                            <div class="match-competition">

                                🏆 ${row.Competition || ""}

                            </div>

                        </div>

                        <div class="match-poule">

                            ${row.Poule || ""}

                        </div>

                    </div>

                    <div class="match-teams">

                        <div class="team home">

                            ${domicile}

                        </div>

                        <div class="score">

                            ${score}

                        </div>

                        <div class="team away">

                            ${exterieur}

                        </div>

                    </div>

                    ${
                        row.Statu
                        ?
                        `
                        <div class="match-status">

                            ${row.Statu}

                        </div>
                        `
                        :
                        ""
                    }

                </div>

            `;

        });

        html += `

            </div>

        `;

    });

    if (data.length === 0) {

        html = `

            <div class="message">

                Aucun match enregistré
                pour cette sélection.

            </div>

        `;

    }

    document.getElementById(
        "resultatsResult"
    ).innerHTML = html;

}


// =====================================================
// CONVERTIR DATE FRANCAISE
// =====================================================

function convertirDate(dateValue) {

    if (!dateValue) {

        return new Date(0);

    }

    const texte =
        String(dateValue).trim();

    const parts =
        texte.split("/");

    if (parts.length === 3) {

        return new Date(

            Number(parts[2]),

            Number(parts[1]) - 1,

            Number(parts[0])

        );

    }

    return new Date(dateValue);

}
